[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k11-integration-qa-mcp"
version = "0.1.0"
description = "MCP server and CI tool for integration testing of event-driven and batch systems: flows that combine API calls, Kafka messages (publish, expect, dead-letter queues, AsyncAPI schemas), batch jobs and database checks, with evidence for release decisions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K11 Software Solutions" }]
requires-python = ">=3.10"
keywords = ["mcp", "integration-testing", "kafka", "event-driven", "asyncapi", "batch-jobs", "middleware", "database-testing", "qa", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["k11-api-functional-qa-mcp>=0.1.1,<0.2", "mcp>=1.20,<2"]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0.2"]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/K11-Software-Solutions/k11techlab-integration-qa-mcp"
Issues = "https://github.com/K11-Software-Solutions/k11techlab-integration-qa-mcp/issues"

[project.scripts]
k11-integration-qa-mcp = "k11_integration_qa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k11_integration_qa"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
